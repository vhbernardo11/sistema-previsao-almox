name: IntegraTrampo JS Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '.github/workflows/integratrampo-js-check.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f \( -name '*.js' -o -name '*.cjs' \) -not -path './node_modules/*' -print0)
          echo "Checked $count JavaScript files successfully."
          test "$count" -gt 0
      - name: Test Stage 16 social preview handler
        run: node scripts/stage16-share-api-smoke.cjs
